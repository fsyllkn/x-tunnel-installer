name: Build x-tunnel

on:
  workflow_dispatch:
  push:
    paths:
      - 'x-tunnel.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - '.github/workflows/build-x-tunnel.yml'
  pull_request:
    paths:
      - 'x-tunnel.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - '.github/workflows/build-x-tunnel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Verify and build Linux binaries
        run: |
          go vet ./...
          go test ./...
          bash build.sh all
          git diff --exit-code -- go.mod go.sum
      - name: Smoke test amd64 binary
        run: |
          ./dist/x-tunnel-linux-amd64 -h > dist/help.txt 2>&1
          grep -q -- '-token' dist/help.txt
          python3 - <<'PY'
          import socket, subprocess, time
          with socket.socket() as sock:
              sock.bind(('127.0.0.1', 0))
              port = sock.getsockname()[1]
          with open('dist/server-smoke.log', 'w') as log:
              process = subprocess.Popen([
                  './dist/x-tunnel-linux-amd64', '-l',
                  f'wss://127.0.0.1:{port}', '-token', 'build-smoke-test'
              ], stdout=log, stderr=subprocess.STDOUT)
              try:
                  for _ in range(100):
                      if process.poll() is not None:
                          raise RuntimeError('WSS server exited before listening')
                      try:
                          with socket.create_connection(('127.0.0.1', port), timeout=0.2):
                              break
                      except OSError:
                          time.sleep(0.1)
                  else:
                      raise RuntimeError('WSS server did not listen within 10 seconds')
              finally:
                  process.terminate()
                  process.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: x-tunnel-linux-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-verified:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x-tunnel-linux-${{ github.sha }}
          path: dist/
      - name: Verify and publish known-good binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c x-tunnel-linux-amd64.sha256
          sha256sum -c x-tunnel-linux-arm64.sha256
          printf '%s  %s\n' ae3a79a4d2a6a8d7e1377afb2e022c5ed75b0157a694fb6aead9d86ab873ccc2 x-tunnel-linux-amd64 | sha256sum -c -
          printf '%s  %s\n' 18b08c599c717696f44a540da6af039c5d0efaf4112679d2a04c9122d077f047 x-tunnel-linux-arm64 | sha256sum -c -
          tag=verified-d219c34
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" x-tunnel-linux-{amd64,arm64}{,.sha256} --clobber
          else
            gh release create "$tag" x-tunnel-linux-{amd64,arm64}{,.sha256} \
              --title 'Verified x-tunnel build (d219c34)' \
              --notes 'Built from the repository source. Linux amd64 is byte-identical to the user-provided working binary.'
          fi
